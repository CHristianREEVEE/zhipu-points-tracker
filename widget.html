<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>积分悬浮窗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{height:100%;overflow:hidden;background:transparent}
body{
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:#e8ecf4;cursor:default;
  -webkit-app-region:drag;
}
.win{
  height:100vh;
  display:flex;flex-direction:column;
  background:rgba(13,18,32,.72);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  padding:10px 12px 8px;
}
/* 顶部：时钟居中独占一行 */
#clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#aebdd8;
  text-align:center;letter-spacing:.05em;padding-bottom:5px}
/* 今日消耗切换器 */
.dayNav{display:flex;align-items:center;gap:6px;margin-top:2px}
.dayNav .arrow{font-size:12px;color:#78829b;background:rgba(255,255,255,.07);border:0;
  width:18px;height:18px;line-height:16px;border-radius:5px;cursor:pointer;text-align:center;
  -webkit-app-region:no-drag;padding:0}
.dayNav .arrow:hover{background:rgba(255,255,255,.18);color:#fff}
.dayNav .arrow:disabled{opacity:.25;cursor:default}
.today{font-size:12px;color:#8fb7ff;font-variant-numeric:tabular-nums;flex:1}
/* 穿透模式：禁拖拽禁按钮，只留右键 */
.pt-on .win{-webkit-app-region:no-drag}
.pt-on .acts{pointer-events:none;opacity:.35}

.row1{display:flex;align-items:baseline;justify-content:space-between}
.lab{font-size:11px;color:#b7c1d6;letter-spacing:.12em}
.pts{font-size:24px;font-weight:700;line-height:1.05;
  background:linear-gradient(120deg,#cfe0ff,#8fb7ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.today{font-size:12px;color:#8fb7ff;font-variant-numeric:tabular-nums}
#clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#9fb0cc;
  margin-top:3px;letter-spacing:.04em}
.hr{border-top:1px solid rgba(255,255,255,.09);margin:6px 0 4px}
.listlab{font-size:10px;color:#7e89a3;letter-spacing:.1em;margin-bottom:3px}
.task{display:flex;align-items:center;gap:6px;font-size:11px;line-height:16px;height:16px}
.task .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cdd6e6}
.task .a{font-variant-numeric:tabular-nums;color:#ff9d9d}
.task .d{font-family:ui-monospace,Menlo,Consolas,monospace;color:#78829b;font-size:10px}
.notk{font-size:11px;color:#5f6a80;line-height:16px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.meta{font-size:10px;color:#78829b}
.acts{display:flex;gap:5px}
.btn{font-size:10px;color:#c9d2e4;background:rgba(255,255,255,.08);border:0;
  border-radius:7px;padding:4px 8px;cursor:pointer;-webkit-app-region:no-drag}
.btn:hover{background:rgba(255,255,255,.16);color:#fff}
.btn.spin{pointer-events:none;opacity:.6}
#ptChip{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);display:none;
  font-size:10px;color:#fff;background:rgba(90,140,255,.92);border-radius:9px;
  padding:3px 10px;z-index:9;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.pt-on #ptChip{display:block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
#lock{display:none;padding:8px;font-size:11px;color:#9aa5bc}
#lock input{width:100%;margin-top:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);
  border-radius:8px;color:#e8ecf4;padding:6px 8px;font-size:12px;outline:none;-webkit-app-region:no-drag}
</style>
</head>
<body>
<div class="win" id="win">
  <div id="clock">----/--/-- --:--:--</div>
  <div class="row1"><span class="lab" id="nick">积分</span><span class="pts" id="pts">——</span></div>
  <div class="row2">
    <div class="dayNav">
      <button class="arrow" id="dayPrev" onclick="shiftDay(-1)" title="前一天">‹</button>
      <div class="today" id="today">加载中…</div>
      <button class="arrow" id="dayNext" onclick="shiftDay(1)" title="后一天">›</button>
    </div>
    <svg id="spark" width="92" height="22"></svg>
  </div>
  <div class="hr"></div>
  <div class="listlab">最近任务</div>
  <div id="tasks"><div class="notk">加载中…</div></div>
  <div class="foot">
    <span class="meta" id="meta"></span>
    <div class="acts">
      <button class="btn" id="refBtn" onclick="refresh()">刷新</button>
      <button class="btn" onclick="openFull()">详情</button>
      <button class="btn" id="ptBtn" onclick="enablePT()" title="开启后鼠标穿过此窗直达下层；右键本窗恢复">穿透</button>
    </div>
  </div>
  <div id="lock">悬浮窗锁定中，输入访问密钥解锁：<input id="pkInput" placeholder="访问密钥" /></div>
</div>
<div id="ptChip">🖱 右键本窗恢复交互</div>
<script>
const API='api/';
const KEY=(()=>{try{return localStorage.getItem('pk')||''}catch(e){return ''}})();
const E2=!!(window.__electron&&window.__electron.ptArm);   // v2 壳检测

function fmt(n){return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function ago(ts){if(!ts)return'';const s=Date.now()/1000-ts;
  if(s<90)return'刚刚';if(s<3600)return Math.floor(s/60)+'分前';
  if(s<86400)return Math.floor(s/3600)+'小时前';return Math.floor(s/86400)+'天前'}
const WD=['日','一','二','三','四','五','六'];
function p2(n){return String(n).padStart(2,'0')}
function clockTick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())
    +' 周'+WD[d.getDay()]+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}
setInterval(clockTick,1000);clockTick();

async function load(){
  if(!KEY){document.getElementById('lock').style.display='block';return}
  try{
    const r=await fetch(API+'summary',{headers:{'X-Key':KEY}});
    const d=await r.json();
    const m=d.member||{},pts=Number(m.left_score)||0;
    const el=document.getElementById('pts');
    el.textContent=fmt(pts);
    el.className='pts'+(pts<3000?' crit':pts<10000?' warn':'');
    document.getElementById('nick').textContent='积分·'+(m.nickname||'');
    document.getElementById('meta').textContent=ago(d.updated_at)+'抓取';
    renderToday(d.records||[]);
    renderTasks(d.records||[]);
    draw(d.snapshots||[]);
  }catch(e){document.getElementById('today').textContent='网络异常';}
}
let dayOffset=0;   // 0=今天，-1=昨天…（按天切换看消耗）
function shiftDay(d){
  dayOffset=Math.min(0,Math.max(-7,dayOffset+d));  // 最多回看7天，不能跑到未来
  renderToday(lastRecs);
}
let lastRecs=[];
function renderToday(recs){
  lastRecs=recs;
  const t0=new Date();t0.setHours(0,0,0,0);
  t0.setDate(t0.getDate()+dayOffset);
  const t1=new Date(t0);t1.setDate(t1.getDate()+1);
  let sum=0;
  for(const r of recs){
    const v=Number(r.score);
    if(v<0&&r.created_at*1000>=t0.getTime()&&r.created_at*1000<t1.getTime())sum+=v;
  }
  const lbl=dayOffset===0?'今日':dayOffset===-1?'昨日':(p2(t0.getMonth()+1)+'/'+p2(t0.getDate()));
  document.getElementById('today').textContent=sum?(lbl+'消耗 -'+fmt(Math.abs(sum))):(lbl+'无消耗');
  document.getElementById('dayNext').disabled=(dayOffset===0);
  document.getElementById('dayPrev').disabled=(dayOffset===-7);
}
function renderTasks(recs){
  const box=document.getElementById('tasks');
  const neg=recs.filter(r=>Number(r.score)<0).slice(0,3);
  if(!neg.length){box.innerHTML='<div class="notk">暂无任务消耗</div>';return}
  const now=new Date();
  box.innerHTML=neg.map(r=>{
    const t=new Date(r.created_at*1000);
    const same=t.toDateString()===now.toDateString();
    const tm=same?(p2(t.getHours())+':'+p2(t.getMinutes())+':'+p2(t.getSeconds()))
      :(p2(t.getMonth()+1)+'-'+p2(t.getDate())+' '+p2(t.getHours())+':'+p2(t.getMinutes())+':'+p2(t.getSeconds()));
    let title=String(r.title||'').replace(/^【AgentMore】/,'');
    return `<div class="task"><span class="t">${title.replace(/</g,'&lt;')}</span>`+
      `<span class="a">${fmt(Math.abs(Number(r.score)))}</span><span class="d">${tm}</span></div>`;
  }).join('');
}
function draw(sn){
  const svg=document.getElementById('spark');
  const now0=Date.now()/1000;
  sn=sn.filter(x=>now0-x.ts<30*86400);
  if(sn.length<2){svg.innerHTML='<text x="46" y="14" fill="#5f6a80" font-size="9" text-anchor="middle">趋势积累中</text>';return}
  const W=92,H=22,P=2;
  const xs=sn.map(x=>x.ts),ys=sn.map(x=>x.score);
  const x0=Math.min(...xs),x1=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const X=t=>P+(x1===x0?0:(t-x0)/(x1-x0)*(W-2*P));
  const Y=v=>H-P-(ymax===ymin?0.5:(v-ymin)/(ymax-ymin)*(H-2*P));
  const path=sn.map((p,i)=>(i?'L':'M')+X(p.ts).toFixed(1)+','+Y(p.score).toFixed(1)).join('');
  svg.innerHTML='<path d="'+path+'" fill="none" stroke="#7aa2ff" stroke-width="1.6" stroke-linejoin="round"/>'+
    '<circle cx="'+X(sn[sn.length-1].ts).toFixed(1)+'" cy="'+Y(sn[sn.length-1].score).toFixed(1)+'" r="2" fill="#7aa2ff"/>';
}

function refresh(){
  const b=document.getElementById('refBtn');
  b.classList.add('spin');b.textContent='…';
  fetch(API+'refresh',{method:'POST',headers:{'X-Key':KEY}}).catch(()=>{});
  setTimeout(()=>{load();b.classList.remove('spin');b.textContent='刷新';},2500);
}
function openFull(){
  window.open(location.href.replace(/widget\.html.*$/,''),'积分面板');
}

/* ============ 穿透模式：右键恢复 ============ */
let PT=false,armed=false;
function syncPTUI(){document.body.classList.toggle('pt-on',PT)}
function enablePT(){
  if(PT)return;
  PT=true;syncPTUI();
  if(E2)window.__electron.ptSet(true);
}
/* 穿透中 mousemove 仍被转发(forward)到页面：
   光标进入窗口 → 临时恢复鼠标事件，让右键能落到本窗上；
   左键在穿透模式下完全失效（不拖拽/不按钮），绝不干扰正常使用 */
document.addEventListener('mousemove',()=>{
  if(PT&&!armed&&E2){armed=true;window.__electron.ptArm(true);}
});
document.addEventListener('mouseleave',()=>{
  if(PT&&armed&&E2){armed=false;window.__electron.ptArm(false);}
});
/* 主进程菜单点了「恢复交互」 */
if(E2&&window.__electron.onPtState){
  window.__electron.onPtState(on=>{PT=!!on;armed=false;syncPTUI();});
}
/* 非 v2 壳：隐藏穿透按钮（浏览器/旧exe不支持完整流程） */
if(!E2)document.getElementById('ptBtn').style.display='none';

document.getElementById('pkInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=e.target.value.trim();if(v){localStorage.setItem('pk',v);location.reload();}}
});
load();setInterval(load,60000);
</script>
</body>
</html>
